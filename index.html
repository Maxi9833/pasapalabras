<!DOCTYPE html>
<html lang="es">

    <meta charset="UTF-8">

    <title>Pasapalabra Extremo 🏆</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            width: 95%;
            max-width: 900px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .match-panel {
            display: flex;
            gap: 20px;
            background-color: #0f172a;
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid #334155;
        }

        .player-score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-score-box.you { color: var(--accent-green); }
        .player-score-box.rival { color: var(--accent-yellow); }

        .score-val { font-size: 1.4rem; font-weight: bold; }

        .timer {
            font-size: 1.8rem;
            font-weight: bold;
            background-color: #334155;
            padding: 10px 20px;
            border-radius: 10px;
            color: var(--accent-yellow);
        }

        .setup-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
        }

        .select-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .theme-select {
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 8px;
            background-color: #0f172a;
            color: white;
            border: 2px solid #334155;
            cursor: pointer;
        }

        .mode-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-mode {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-solo { background-color: var(--accent-blue); color: white; }
        .btn-multi { background-color: var(--accent-purple); color: white; }
        .btn-mode:hover { transform: scale(1.05); }

        /* ROSCO CON EMOJI AL CENTRO */
        .rosco-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 0 auto 20px auto;
        }

        .emoji-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4.5rem;
            user-select: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letter-node {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: #334155;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .letter-node.current {
            background-color: var(--accent-yellow);
            color: black;
            transform: scale(1.3);
            box-shadow: 0 0 15px var(--accent-yellow);
            z-index: 10;
        }

        .letter-node.correct { background-color: var(--accent-green); }
        .letter-node.wrong { background-color: var(--accent-red); }

        .powerups {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-powerup {
            background-color: var(--accent-purple);
            color: white;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-powerup:disabled {

            border-radius: 10px;

            align-items: center;
            justify-content: center;
            font-size: 1.15rem;

            margin-top: 8px;

        }

            border: 2px solid #334155;

            padding: 15px;

</head>

        </div>

        <h3>2. Elige el Modo:</h3>
        <div class="mode-buttons">
            <button class="btn-mode btn-solo" onclick="startSinglePlayer()">👤 Modo Solitario</button>
            <button class="btn-mode btn-multi" onclick="showLobby()">⚔️ Modo Multijugador</button>
        </div>

        <!-- Tabla de posiciones -->

    </div>

            <button class="btn-powerup" id="btn-freeze" onclick="useFreeze()">❄️ Congelar 10s</button>

    // GENERADOR DE EFECTOS DE SONIDO (WEB AUDIO API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'freeze') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'win') {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.15);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    function normalizeText(text) {
        return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function setEmoji(face) {
        const el = document.getElementById('emoji-face');
        el.innerText = face;
        el.style.transform = 'translate(-50%, -50%) scale(1.3)';
        setTimeout(() => el.style.transform = 'translate(-50%, -50%) scale(1)', 300);
    }

    function loadLeaderboard() {
        const scores = JSON.parse(localStorage.getItem('pasapalabra_scores') || '[]');
        const list = document.getElementById('leaderboard-list');
        if (scores.length === 0) {
            list.innerHTML = '<li style="text-align: center; color: #94a3b8;">Sin récords aún</li>';
            return;
        }
        list.innerHTML = scores.map((s, i) => `
            <li class="leaderboard-item">
                <span>#${i+1} ${s.name}</span>
                <span style="color: var(--accent-yellow); font-weight: bold;">${s.score} pts</span>
            </li>
        `).join('');
    }

    function saveScore(name, score) {
        let scores = JSON.parse(localStorage.getItem('pasapalabra_scores') || '[]');
        scores.push({ name, score });
        scores.sort((a, b) => b.score - a.score);
        scores = scores.slice(0, 5); // Guardar solo Top 5
        localStorage.setItem('pasapalabra_scores', JSON.stringify(scores));
    }

    function getSelectedQuestions() {
        const selectedTheme = document.getElementById('theme-selector').value;
        return JSON.parse(JSON.stringify(themesData[selectedTheme]));
    }

    function startSinglePlayer() {
        isMultiplayer = false;
        questions = getSelectedQuestions();

        const diff = document.getElementById('diff-selector').value;
        if (diff === 'facil') { timeLeft = 180; errorPenalty = 0; }
        else if (diff === 'normal') { timeLeft = 120; errorPenalty = 0; }
        else if (diff === 'extremo') { timeLeft = 60; errorPenalty = 10; }

        document.getElementById('mode-selector').style.display = 'none';
        document.getElementById('match-panel').style.display = 'flex';
        document.getElementById('timer-box').style.display = 'block';
        document.getElementById('game-main').style.display = 'block';

        initRosco();
    }

    function showLobby() {
        document.getElementById('mode-selector').style.display = 'none';
        document.getElementById('lobby-screen').style.display = 'flex';
    }

    function backToMenu() {
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('mode-selector').style.display = 'flex';
    }

    function joinMultiplayer() {
        const name = document.getElementById('player-name').value.trim();
        if (!name) return alert("Escribe un nombre");

        isMultiplayer = true;
        questions = getSelectedQuestions();
        document.getElementById('my-name-display').innerText = `👤 ${name}`;
        document.getElementById('lobby-status').innerText = "Conectando al servidor...";

        if (typeof io !== 'undefined') {
            socket = io();
            socket.on('connect', () => {
                socket.emit('join_game', { name: name, theme: document.getElementById('theme-selector').value });
            });

            socket.on('waiting_for_opponent', () => {
                document.getElementById('lobby-status').innerText = "Esperando oponente...";
            });

            socket.on('start_match', (data) => {
                currentGameId = data.gameId;
                Object.keys(data.players).forEach(id => {
                    if (id !== socket.id) document.getElementById('rival-name-display').innerText = `👾 ${data.players[id]}`;
                });

                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('match-panel').style.display = 'flex';
                document.getElementById('vs-divider').style.display = 'block';
                document.getElementById('rival-box').style.display = 'flex';
                document.getElementById('timer-box').style.display = 'block';
                document.getElementById('game-main').style.display = 'block';

                initRosco();
            });

            socket.on('player_progress', (data) => {
                document.getElementById('rival-score').innerText = `${data.score} pts`;
            });

            socket.on('connect_error', () => {
                document.getElementById('lobby-status').innerText = "❌ No se pudo conectar al servidor Node.js.";
            });
        }
    }

    function initRosco() {
        const container = document.getElementById('rosco');
        container.innerHTML = '';
        const total = questions.length;
        const radius = 135;

        questions.forEach((q, index) => {
            const angle = (index / total) * 2 * Math.PI - (Math.PI / 2);
            const x = Math.round(150 + radius * Math.cos(angle));
            const y = Math.round(150 + radius * Math.sin(angle));

            const node = document.createElement('div');
            node.className = 'letter-node';
            node.id = `node-${q.letter}`;
            node.innerText = q.letter;
            node.style.left = `${x}px`;
            node.style.top = `${y}px`;
            container.appendChild(node);
        });

        startTimer();
        loadQuestion();
    }

    function loadQuestion() {
        if (checkGameEnd()) return;

        document.querySelectorAll('.letter-node').forEach(n => n.classList.remove('current'));

        let attempts = 0;
        while ((questions[currentIndex].status === 'correct' || questions[currentIndex].status === 'wrong') && attempts < questions.length) {
            currentIndex = (currentIndex + 1) % questions.length;
            attempts++;
        }

        if (checkGameEnd()) return;

        const q = questions[currentIndex];
        document.getElementById(`node-${q.letter}`).classList.add('current');
        document.getElementById('question').innerText = `Empieza por ${q.letter}: ${q.question}`;
        document.getElementById('hint-display').innerText = '';
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();
        setEmoji('🤔');
    }

    function checkAnswer() {
        const input = document.getElementById('answer-input').value;
        if (!input) return;

        const currentQ = questions[currentIndex];
        const isCorrect = normalizeText(input) === normalizeText(currentQ.answer);
        const node = document.getElementById(`node-${currentQ.letter}`);

        userAnswers[currentQ.letter] = { input: input, correctAnswer: currentQ.answer, isCorrect: isCorrect };

        if (isCorrect) {
            currentQ.status = 'correct';
            node.classList.add('correct');
            hits++;
            playSound('correct');
            setEmoji('🎉');
        } else {
            currentQ.status = 'wrong';
            node.classList.add('wrong');
            errors++;
            playSound('wrong');
            setEmoji('😱');
            if (errorPenalty > 0) timeLeft = Math.max(0, timeLeft - errorPenalty);
        }

        const currentScore = hits * 10;
        document.getElementById('my-score').innerText = `${currentScore} pts`;

        if (isMultiplayer && socket) {
            socket.emit('submit_answer', { gameId: currentGameId, score: currentScore });
        }

        setTimeout(() => nextQuestion(), 400);
    }

    function useHint() {
        if (timeLeft <= 10) return;

        const currentQ = questions[currentIndex];
        const word = currentQ.answer;

        if (word.length > 2) {
            const randomIndex = Math.floor(Math.random() * (word.length - 1)) + 1;
            const revealedChar = word.charAt(randomIndex).toUpperCase();
            document.getElementById('hint-display').innerText = `💡 Pista: Contiene "${revealedChar}" en la pos ${randomIndex + 1} (${word.length} letras)`;
        } else {
            document.getElementById('hint-display').innerText = `💡 Pista: La palabra tiene ${word.length} letras`;
        }

        timeLeft = Math.max(1, timeLeft - 10);
        document.getElementById('timer').innerText = `⏱️ ${timeLeft}s`;
        document.getElementById('btn-hint').disabled = true;
    }

    function useFreeze() {
        freezeActive = true;
        playSound('freeze');
        setEmoji('🥶');
        const btn = document.getElementById('btn-freeze');
        btn.disabled = true;
        setTimeout(() => { freezeActive = false; setEmoji('🤔'); }, 10000);
    }

    function pasapalabra() { 
        setEmoji('😏');
        nextQuestion(); 
    }

    function nextQuestion() {
        document.getElementById('btn-hint').disabled = false;
        currentIndex = (currentIndex + 1) % questions.length;
        loadQuestion();
    }

    function startTimer() {
        const timerElement = document.getElementById('timer');
        timerInterval = setInterval(() => {
            if (!freezeActive) {
                timeLeft--;
                timerElement.innerText = `⏱️ ${timeLeft}s`;
                if (timeLeft <= 0) endGame();
            }
        }, 1000);
    }

    function checkGameEnd() {
        const completed = questions.every(q => q.status === 'correct' || q.status === 'wrong');
        if (completed) { endGame(); return true; }
        return false;
    }

    function endGame() {
        clearInterval(timerInterval);
        playSound('win');
        setEmoji('💀');

        document.getElementById('game-main').style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';

        const myScore = hits * 10;
        const myName = document.getElementById('player-name').value.trim() || 'Jugador Solitario';
        
        saveScore(myName, myScore);

        document.getElementById('final-stats').innerHTML = `
            <strong>Puntuación Final:</strong> <span style="color: var(--accent-yellow);">${myScore} pts</span><br>
            <strong>Aciertos:</strong> ${hits} ✅ | <strong>Errores:</strong> ${errors} ❌
        `;

        const reviewContainer = document.getElementById('answers-review');
        reviewContainer.innerHTML = '';

        questions.forEach(q => {
            const userRes = userAnswers[q.letter];
            const div = document.createElement('div');

            if (userRes && userRes.isCorrect) {
                div.className = 'review-item correct-item';
                div.innerHTML = `<strong>[${q.letter}]</strong> Acertaste: <em>${userRes.input}</em> ✅`;
            } else if (userRes && !userRes.isCorrect) {
                div.className = 'review-item wrong-item';
                div.innerHTML = `<strong>[${q.letter}]</strong> Dijiste: <em>"${userRes.input}"</em> ❌ | <strong>Correcta:</strong> <span style="color: var(--accent-green);">${q.answer.toUpperCase()}</span>`;
            } else {
                div.className = 'review-item wrong-item';
                div.innerHTML = `<strong>[${q.letter}]</strong> Sin responder ⏱️ | <strong>Correcta:</strong> <span style="color: var(--accent-green);">${q.answer.toUpperCase()}</span>`;
            }

            reviewContainer.appendChild(div);
        });
    }

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAnswer();
    });

    // Cargar Récords al abrir
    loadLeaderboard();
</script>
</body>
</html>
